[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underpass-tools"
version = "0.2.0"
description = "Standalone street-lidar ceiling estimation"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "shapely>=2.1,<3", "laspy[lazrs]>=2.6,<3", "rasterio>=1.4,<2", "pyproj>=3.7,<4"]

[project.scripts]
streetlidar-heights = "underpass_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"underpass_tools.zigpip" = ["*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
